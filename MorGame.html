<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MorGame</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<style>
:root{--bg:#08090d;--surface:#11131a;--card:#191c26;--border:#2a2e3d;--red:#ff3c5a;--green:#00e5a0;--gold:#ffd166;--blue:#58a6ff;--text:#f3f5fa;--muted:#858ca3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,sans-serif;min-height:100vh;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}
#root{min-height:100vh}
.lobby,.waiting,.game{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px;gap:14px}
.lobby{justify-content:center}
.logo{font:110px/0.8 "Bebas Neue";letter-spacing:8px;direction:ltr;background:linear-gradient(135deg,#ff3c5a,#ff8c42,#ffd166);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #ff3c5a55)}
.sub{color:var(--muted);font-size:13px;letter-spacing:3px}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}
.label{font-size:12px;color:var(--muted);margin-bottom:7px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:0;margin-bottom:9px}
.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900;margin-top:6px}
.primary{background:linear-gradient(135deg,var(--red),#ff743c);color:white}
.green{background:linear-gradient(135deg,var(--green),#00b87e);color:#07100d}
.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.room{font:70px "Bebas Neue";letter-spacing:13px;color:var(--red);direction:ltr;text-align:center}
.players{width:min(380px,100%);display:flex;flex-direction:column;gap:7px}
.player{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:13px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#262b3a,#171a24);font-size:23px;border:2px solid var(--border);flex:none}
.name{font-weight:900}.host{font-size:10px;color:var(--gold)}
.avatar-picker{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.avatar-choice{width:43px;height:43px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px}
.avatar-choice.selected{border:2px solid var(--green);box-shadow:0 0 14px #00e5a055}
.word{display:flex;gap:5px;direction:ltr}
.letter{width:clamp(48px,12vw,62px);height:clamp(48px,12vw,62px);display:grid;place-items:center;border:2px solid var(--border);background:var(--card);border-radius:9px;font:clamp(40px,10vw,55px) "Bebas Neue";transition:.25s}
.letter.cross{color:var(--red);border-color:var(--red);box-shadow:0 0 16px #ff3c5a55;position:relative}.letter.cross:after{content:"";position:absolute;width:105%;height:3px;background:var(--red);transform:rotate(-8deg)}
.turn{width:min(380px,100%);padding:11px;text-align:center;border-radius:13px;font-weight:900;background:#161a22;border:1px solid var(--border)}
.turn.mine{color:var(--green);border-color:#00e5a077}.turn.other{color:var(--red)}
.grid-wrap{position:relative;width:min(380px,94vw);aspect-ratio:1}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;direction:ltr}
.cell{display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-weight:900;font-size:clamp(16px,5vw,23px);user-select:none}
.cell.available{border-color:#00e5a055;box-shadow:inset 0 0 0 1px #00e5a022}
.cell.marked{background:#242a38;color:#737b90}
.cell.flash{animation:flash .45s}.cell.line{background:#263b36;border-color:var(--green);color:var(--green)}
@keyframes flash{50%{transform:scale(1.08);box-shadow:0 0 22px #00e5a0}}
.tools,.reactions{width:min(380px,100%);display:flex;gap:6px;flex-wrap:wrap}
.tool,.react{flex:1;min-width:80px;padding:10px 6px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:900}
.tool:disabled{opacity:.35;cursor:not-allowed}.tool b{display:block;color:var(--gold);font-size:11px;margin-top:2px}
.reactions .react{min-width:54px;font-size:22px}
.turns{width:min(380px,100%);display:flex;gap:5px;overflow:auto;direction:ltr}.chip{padding:6px 10px;border:1px solid var(--border);border-radius:20px;color:var(--muted);white-space:nowrap}.chip.active{color:var(--green);border-color:var(--green)}
.status{width:min(380px,100%);display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px;font-size:12px}
.overlay{position:fixed;inset:0;background:#05060adf;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:20}
.result{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;text-align:center}.result h1{font:65px "Bebas Neue";margin:0;color:var(--green)}.result.lose h1{color:var(--red)}
.rank{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border)}
.pop{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--card);border:2px solid var(--green);border-radius:18px;padding:10px 18px;z-index:30;transition:.25s;white-space:nowrap;font-weight:900}.pop.show{opacity:1;transform:translateX(-50%)}
.power-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:31;background:#171b25;border:1px solid var(--gold);padding:10px 15px;border-radius:13px;display:none}
.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div><div id="pop" class="pop"></div><div id="powerToast" class="power-toast"></div>
<script>
/* MorGame — تحديث مبني على منطق اللعبة الأصلية */
const ABLY_KEY='3wYwNQ.QrE9rw:iP9Hi9MwnqMEx--dQMNDKgKnA1xXd27m0xY-8HQoiPM';
const MAX_PLAYERS=10, MIN_PLAYERS=2, WIN_LINES=5;
const WORD=['M','O','R','A','D'];
const AVATARS=['😎','👑','🔥','🦊','🐼','🐯','🐸','👽','🤖','🥷','🦁','🐺','💀','⚡','🎯','🧠'];
const REACTIONS=['😂','🔥','😱','😎','💀','👏','❤️','🤯'];
const POWERS={
 double:{emoji:'⚡',name:'ضربة مزدوجة',desc:'اشطب خانتين في دورك'},
 freeze:{emoji:'❄️',name:'تجميد',desc:'تجاوز دور اللاعب التالي'},
 shuffle:{emoji:'🔀',name:'خلط',desc:'أعد خلط الأرقام غير المشطوبة'}
};
const QUICK=['لعييييب 🔥','مبروووك 👏','أسرع 😤','ابلع 😂','يا ساتر 😱','ركز شوي 👀'];

function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function board(){return shuffle([...Array(25)].map((_,i)=>i+1))}
function id(){return Math.random().toString(36).slice(2,11)}
function code(){return String(Math.floor(1000+Math.random()*9000))}
function lines(marked){let s=new Set(marked),out=[];for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>s.has(r*5+c)))out.push(['row',r]);for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>s.has(r*5+c)))out.push(['col',c]);if([0,6,12,18,24].every(i=>s.has(i)))out.push(['diag',0]);if([4,8,12,16,20].every(i=>s.has(i)))out.push(['diag',1]);return out}
function lineCells(l){if(l[0]=='row')return [0,1,2,3,4].map(c=>l[1]*5+c);if(l[0]=='col')return [0,1,2,3,4].map(r=>r*5+l[1]);return l[1]===0?[0,6,12,18,24]:[4,8,12,16,20]}
function toast(t){let e=document.getElementById('pop');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function powerToast(t){let e=document.getElementById('powerToast');e.textContent=t;e.style.display='block';clearTimeout(powerToast.t);powerToast.t=setTimeout(()=>e.style.display='none',2200)}

let S={screen:'lobby',playerId:id(),name:'',avatar:AVATARS[0],room:'',host:false,players:{},board:board(),marked:[],order:[],turn:0,started:false,result:null,finish:[],powers:{},channel:null,ably:null};

function render(){document.getElementById('root').innerHTML=
 S.screen==='lobby'?lobby():
 S.screen==='waiting'?waiting():
 S.screen==='game'?game():result();attach()}
function lobby(){
return `<div class="lobby"><div class="logo">MorGame</div><div class="sub">لعبة جماعية • 2 إلى 10 لاعبين</div>
<div class="card"><div class="label">اسمك</div><input id="name" maxlength="14" placeholder="أدخل اسمك" value="${esc(S.name)}">
<div class="label">اختر Avatar</div><div class="avatar-picker">${AVATARS.map(a=>`<button class="avatar-choice ${a===S.avatar?'selected':''}" data-avatar="${a}">${a}</button>`).join('')}</div>
<button class="btn primary" id="create">✦ إنشاء غرفة</button><div class="small" style="text-align:center;margin:10px">أو انضم إلى غرفة</div>
<input id="room" maxlength="4" inputmode="numeric" placeholder="0000"><button class="btn green" id="join">انضم ▶</button></div></div>`}
function waiting(){
let ps=Object.entries(S.players);return `<div class="waiting"><div class="logo" style="font-size:58px">MorGame</div><div class="card"><div class="label">كود الغرفة</div><div class="room">${S.room}</div><button class="btn secondary" id="copy">📋 نسخ الكود</button></div>
<div class="players"><div class="label">اللاعبون (${ps.length}/${MAX_PLAYERS})</div>${ps.map(([pid,p],i)=>`<div class="player"><div class="avatar">${p.avatar||'😎'}</div><div><div class="name">${esc(p.name)} ${pid===S.playerId?'(أنت)':''}</div>${i===0?'<div class="host">HOST ★</div>':''}</div></div>`).join('')}</div>
${S.host?`<button class="btn green" id="start" style="max-width:380px" ${ps.length<2?'disabled':''}>ابدأ اللعبة ▶</button>`:'<div class="small">في انتظار المضيف...</div>'}<button class="btn secondary" id="leave" style="max-width:380px">← مغادرة</button></div>`}
function game(){
let my=S.order[S.turn]===S.playerId, ls=lines(S.marked), lc=new Set(ls.flatMap(lineCells));
let cells=S.board.map((n,i)=>`<div class="cell ${S.marked.includes(i)?'marked':''} ${lc.has(i)?'line':''} ${my&&!S.marked.includes(i)?'available':''}" data-i="${i}">${n}</div>`).join('');
let powers=(S.powers[S.playerId]||[]).map((p,i)=>`<button class="tool" data-power="${p}" data-pi="${i}">${POWERS[p].emoji} ${POWERS[p].name}<b>${POWERS[p].desc}</b></button>`).join('');
return `<div class="game"><div class="word">${WORD.map((x,i)=>`<div class="letter ${ls.length>i?'cross':''}">${x}</div>`).join('')}</div>
<div class="turn ${my?'mine':'other'}">${my?'🟢 دورك — اختر رقمًا':'🔴 دور '+esc(S.players[S.order[S.turn]]?.name||'...')}</div>
<div class="grid-wrap"><div class="grid">${cells}</div></div>
<div class="tools">${powers||'<div class="small">لا توجد Power-Up متاحة</div>'}</div>
<div class="turns">${S.order.map((pid,i)=>`<div class="chip ${i===S.turn?'active':''}">${S.players[pid]?.avatar||''} ${esc(S.players[pid]?.name||'?')}</div>`).join('')}</div>
<div class="reactions">${REACTIONS.map(r=>`<button class="react" data-reaction="${r}">${r}</button>`).join('')}</div>
<div class="reactions">${QUICK.map((m,i)=>`<button class="react" style="font-size:11px" data-quick="${i}">${m}</button>`).join('')}</div>
<div class="status"><span>👥 ${Object.keys(S.players).length}</span><span>خطوط: <b style="color:var(--green)">${ls.length}/5</b></span><span>MorGame</span></div></div>`}
function result(){
let win=S.result==='win', rows=S.finish.map((pid,i)=>`<div class="rank"><span>${i+1}. ${S.players[pid]?.avatar||''} ${esc(S.players[pid]?.name||'?')}</span><b>${i===0?'🏆':''}</b></div>`).join('');
return `<div class="overlay"><div class="result ${win?'':'lose'}"><h1>${win?'YOU WIN':'GAME OVER'}</h1><p>${win?'🔥 أنت أول من أكمل MORAD':'حظ أوفر! المباراة انتهت'}</p>${rows}<button class="btn green" id="newround" ${S.host?'':'disabled'}>${S.host?'🔄 جولة جديدة':'في انتظار المضيف...'}</button><button class="btn secondary" id="leave">← مغادرة</button></div></div>`}

function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function enterRoom(name,room,host){
S.name=name.trim();S.room=room;S.host=host;S.players[S.playerId]={name:S.name,avatar:S.avatar};connect();
}
function connect(){
S.screen='waiting';render();
let a=new Ably.Realtime({key:ABLY_KEY,clientId:S.playerId});S.ably=a;
a.connection.on('connected',()=>{let ch=a.channels.get('morgame-'+S.room);S.channel=ch;ch.subscribe(msg=>message(msg));ch.presence.enter({name:S.name,avatar:S.avatar});
ch.presence.subscribe('enter',m=>{if(m.clientId!==S.playerId){S.players[m.clientId]={name:m.data.name,avatar:m.data.avatar||'😎'};render()}});
ch.presence.subscribe('leave',m=>{delete S.players[m.clientId];render()});
ch.presence.get((e,ms)=>{if(!e)ms.forEach(m=>S.players[m.clientId]={name:m.data.name,avatar:m.data.avatar||'😎'});render()})});
a.connection.on('failed',()=>{toast('تعذر الاتصال');S.screen='lobby';render()})
}
function pub(type,data={}){if(S.channel)S.channel.publish(type,{...data,from:S.playerId})}
function start(){
S.order=shuffle(Object.keys(S.players));S.turn=0;S.started=true;S.marked=[];S.board=board();S.finish=[];S.result=null;
S.powers={};S.order.forEach(pid=>S.powers[pid]=shuffle(Object.keys(POWERS)).slice(0,2));
pub('START',{order:S.order,board:S.board,powers:S.powers});S.screen='game';render()}
function newRound(){S.board=board();S.marked=[];S.finish=[];S.result=null;S.turn=0;S.order=shuffle(Object.keys(S.players));S.powers={};S.order.forEach(pid=>S.powers[pid]=shuffle(Object.keys(POWERS)).slice(0,2));pub('NEWROUND',{order:S.order,board:S.board,powers:S.powers});S.screen='game';render()}
function mark(i,extra=0){
if(S.result||!S.started||S.order[S.turn]!==S.playerId||S.marked.includes(i))return;
let nums=[i];if(extra){let other=S.board.map((_,x)=>x).filter(x=>!S.marked.includes(x)&&x!==i);if(other.length)nums.push(other[Math.floor(Math.random()*other.length)])}
let next=(S.turn+1)%S.order.length;
pub('MARK',{indices:nums,next});applyMark(nums,next,S.playerId)}
function applyMark(indices,next,who){
indices.forEach(i=>{if(!S.marked.includes(i))S.marked.push(i)});S.turn=next;
let l=lines(S.marked).length;if(l>=WIN_LINES&&!S.finish.includes(who)){S.finish.push(who);if(who===S.playerId){S.result='win'}else if(!S.finish.includes(S.playerId)){S.finish.push(S.playerId);S.result='lose'}pub('WIN',{finish:S.finish});render();return}
render()}
function usePower(p){
let arr=S.powers[S.playerId]||[],idx=arr.indexOf(p);if(idx<0||S.order[S.turn]!==S.playerId)return;
arr.splice(idx,1);S.powers[S.playerId]=arr;
if(p==='double'){powerToast('⚡ ضربة مزدوجة');pub('POWER',{power:p,fromPlayer:S.playerId});render()}
if(p==='freeze'){let target=(S.turn+1)%S.order.length;let next=(target+1)%S.order.length;pub('POWER',{power:p,target:S.order[target],next});S.turn=next;powerToast('❄️ تم تجميد اللاعب التالي');render()}
if(p==='shuffle'){let nb=shuffle(S.board.map((_,i)=>i).filter(i=>!S.marked.includes(i)).map(i=>S.board[i]));let k=0;S.board=S.board.map((n,i)=>S.marked.includes(i)?n:nb[k++]);pub('POWER',{power:p,board:S.board});powerToast('🔀 تم خلط الأرقام');render()}
}
function message(msg){
let d=msg.data;if(d.from===S.playerId)return;
if(msg.name==='START'){S.order=d.order;S.board=d.board;S.powers=d.powers;S.turn=0;S.started=true;S.screen='game';render()}
else if(msg.name==='NEWROUND'){S.order=d.order;S.board=d.board;S.powers=d.powers;S.marked=[];S.turn=0;S.result=null;S.started=true;S.screen='game';render()}
else if(msg.name==='MARK'){applyMark(d.indices,d.next,d.from)}
else if(msg.name==='POWER'){let p=d.power;if(p==='double'){toast((S.players[d.from]?.name||'لاعب')+' حصل على ⚡')}if(p==='freeze'){S.turn=d.next;toast('❄️ تم تجميد لاعب')}if(p==='shuffle'){S.board=d.board}render()}
else if(msg.name==='WIN'){S.finish=d.finish;if(!S.result){S.result=S.finish[0]===S.playerId?'win':'lose'}render()}
else if(msg.name==='REACTION'){toast((S.players[d.from]?.avatar||'')+' '+d.reaction)}
else if(msg.name==='CHAT'){toast((S.players[d.from]?.name||'')+': '+d.text)}
}
function reaction(r){pub('REACTION',{reaction:r});toast((S.players[S.playerId]?.avatar||'')+' '+r)}
function chat(t){pub('CHAT',{text:t});toast(t)}
function attach(){
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.avatar;render()});
let n=document.getElementById('name');if(n)n.oninput=()=>S.name=n.value;
let room=document.getElementById('room');if(room)room.oninput=()=>S.room=room.value;
let c=document.getElementById('create');if(c)c.onclick=()=>{if(S.name.trim())enterRoom(S.name,code(),true);else toast('أدخل اسمك')};
let j=document.getElementById('join');if(j)j.onclick=()=>{if(S.name.trim()&&S.room.length===4)enterRoom(S.name,S.room,false);else toast('أدخل الاسم وكود 4 أرقام')};
let st=document.getElementById('start');if(st)st.onclick=start;
let cp=document.getElementById('copy');if(cp)cp.onclick=()=>navigator.clipboard?.writeText(S.room).then(()=>toast('تم نسخ الكود'));
document.querySelectorAll('.cell').forEach(e=>e.onclick=()=>mark(+e.dataset.i));
document.querySelectorAll('[data-power]').forEach(e=>e.onclick=()=>usePower(e.dataset.power));
document.querySelectorAll('[data-reaction]').forEach(e=>e.onclick=()=>reaction(e.dataset.reaction));
document.querySelectorAll('[data-quick]').forEach(e=>e.onclick=()=>chat(QUICK[+e.dataset.quick]));
let nr=document.getElementById('newround');if(nr)nr.onclick=newRound;
let lv=document.querySelectorAll('#leave');lv.forEach(e=>e.onclick=()=>{if(S.channel)S.channel.presence.leave();if(S.ably)S.ably.close();S={...S,screen:'lobby',room:'',host:false,players:{},started:false,result:null,marked:[],finish:[]};render()})
}
render();
</script>
</body>
</html>
